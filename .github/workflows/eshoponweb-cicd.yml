name: eShopOnWeb Build and Test

#Triggers (uncomment line below to use it)
on: [push, workflow_dispatch]
#Service principals are updated
#app test
#second run
#Environment variables https://docs.github.com/en/actions/learn-github-actions/environment-variables
env:
  RESOURCE-GROUP: AZ-400-RG
  LOCATION: westus3
  TEMPLATE-FILE: infra/webapp.bicep
  SUBSCRIPTION-ID: 2ab786df-e0cc-4f70-ba1a-e17fd00e5d3b
  WEBAPP-NAME: dxc1application

jobs:
  #Build, test and publish .net web project in repository
  buildandtest:
    runs-on: windows-latest
    steps:
      #checkout the repository
      - uses: actions/checkout@v5

      #prepare runner for desired .net version SDK
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: "preview"

      #Build/Test/Publish the .net project
      - name: Build with dotnet
        run: dotnet build ./eShopOnWeb.sln --configuration Release

      - name: Test with dotnet
        run: dotnet test ./eShopOnWeb.sln --configuration Release --no-build

      - name: dotnet publish
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:DOTNET_ROOT "myapp"
          $zipPath    = Join-Path $env:DOTNET_ROOT "app.zip"

          # Clean previous publish if any
          if (Test-Path $publishDir) { Remove-Item $publishDir -Recurse -Force }
          if (Test-Path $zipPath)    { Remove-Item $zipPath -Force }

          # Publish
          dotnet publish ./src/Web/Web.csproj -c Release -o $publishDir

          # Create zip of the contents of the publish folder (not the folder itself)
          Compress-Archive -Path (Join-Path $publishDir "*") -DestinationPath $zipPath -Force

          Write-Host "Published files zipped to: $zipPath"
          Get-Item $zipPath | Format-List Name, Length, FullName

      # upload the published website code artifacts
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v5
        with:
          name: .net-app
          path: ${{ env.DOTNET_ROOT }}/app.zip

      # upload the bicep template as artifacts for next job
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v5
        with:
          name: bicep-template
          path: ${{ env.TEMPLATE-FILE }}

  deploy:
    runs-on: ubuntu-latest          # <-- REQUIRED for Azure/cli@v2
    needs: buildandtest
    environment:
      name: "Development"
    steps:
      - name: Download .NET app artifact
        uses: actions/download-artifact@v6
        with:
          name: .net-app
          path: .net-app

      - name: Download Bicep template
        uses: actions/download-artifact@v6
        with:
          name: bicep-template
          path: bicep-template

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy infrastructure with Bicep
        uses: azure/arm-deploy@v2
        with:
          subscriptionId: ${{ env.SUBSCRIPTION-ID }}
          resourceGroupName: ${{ env.RESOURCE-GROUP }}
          template: bicep-template/webapp.bicep
          parameters: "webAppName=${{ env.WEBAPP-NAME }} location=${{ env.LOCATION }}"
          failOnStdErr: false

      # Disabled step (kept for reference)
      - name: Publish Website to WebApp (disabled)
        if: false
        uses: Azure/webapps-deploy@v3
        with:
          type: ZIP
          app-name: ${{ env.WEBAPP-NAME }}
          package: .net-app/app.zip

      - name: Publish Website to WebApp (using Azure CLI)
        uses: Azure/cli@v2
        with:
          inlineScript: |
            az webapp deploy \
              --name ${{ env.WEBAPP-NAME }} \
              --resource-group ${{ env.RESOURCE-GROUP }} \
              --src-path .net-app/app.zip \
              --type zip
            az webapp deploy --name ${{ env.WEBAPP-NAME }} --resource-group ${{ env.RESOURCE-GROUP }} --src-path .net-app/app.zip --type zip
